name: Release (softtor)
# Publishes @softtor/nestbun-platform when a tag like softtor-v0.2.0 is pushed to the fork.
# Requires the NPM_TOKEN repository secret for the @softtor scope.
on:
  push:
    tags: ['softtor-v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - name: Publish the renamed package
        run: bun run scripts/publish.ts
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_RENAME: '@nestbun/platform=@softtor/nestbun-platform'
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
